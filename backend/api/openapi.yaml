openapi: 3.1.0
info:
  title: CasaRoca System AI · API
  version: "1.0.0"
  description: |
    API del sistema eclesial de Casa Sobre la Roca: una central y 36 sedes.

    ESTE ARCHIVO SE GENERA. No lo edite a mano: corra `scripts/generar-openapi.js`.
    La verificacion de entrega compara lo generado con lo versionado.

    Autenticacion: token de portador (Bearer). El token dice que sesion DICE ser;
    quien decide es la base, que en cada peticion responde si esa sesion sigue viva.
    Por eso cerrar una sesion surte efecto en el instante.
servers:
  - url: https://api.casaroca.org
    description: produccion
  - url: https://api.staging.casaroca.org
    description: pruebas
  - url: http://127.0.0.1:3000
    description: desarrollo
components:
  securitySchemes:
    portador:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: boolean }
        mensaje: { type: string, description: "En castellano y con la accion siguiente. Nunca filtra la estructura interna." }
        peticionId: { type: string, description: "Identificador de traza. El usuario lo lee por telefono al soporte." }
security:
  - portador: []
paths:
  /api/v1/administracion/alertas:
    get:
      summary: "Quien esta probando contrasenas"
      description: "Intentos fallidos agrupados por usuario y direccion."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/arranque:
    get:
      summary: "Puesta en marcha, contada en la base"
      description: "Directores con el rol EXACTO, equipos con rol, iglesias activas, iglesias CON pastor (y la lista de las que no), personas con acceso y plantillas sin nucleo. Antes se contaba en el navegador sobre listas cortadas y afirmaba cifras falsas."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/auditoria:
    get:
      summary: "Quien hizo que"
      description: "Busca por texto (quien, que fila, motivo, tabla), filtra por `tabla` y pagina con `limite` y `desde`. Cada fila dice que CAMPOS cambiaron, no sus valores. Devuelve el total."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/avisos/:id/reprocesar:
    post:
      summary: "Reprocesar un aviso muerto"
      description: "Lo devuelve a la cola desde cero. Exige `motivo`, que queda en la auditoria: si murio tras cinco intentos, algo tuvo que cambiar."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/avisos:
    get:
      summary: "La bandeja de salida"
      description: "Sus cuatro numeros (pendientes, en espera, muertos y ultimo envio) y los avisos de un estado, por omision los muertos, con el destinatario enmascarado."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/catalogo:
    get:
      summary: "Catalogo de gobierno"
      description: "Lo que la consola necesita en UNA peticion para pintar las casillas: modulos con su nivel de dato, acciones (las seis generales y las propias de cada modulo), roles con su techo y su alcance, niveles de sensibilidad y tipos de documento vigentes. Los tipos de documento salen del catalogo, no de una lista escrita en el frontend: la central los cambia sin desplegar."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/cuentas/:id/desbloquear:
    post:
      summary: "Desbloquear una cuenta"
      description: "Para quien se equivoco cinco veces."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/cuentas/:id/reiniciar-clave:
    post:
      summary: "Reiniciar la contrasena"
      description: "Genera una provisional nueva y CIERRA todas sus sesiones: si no, quien tuviera la sesion abierta con la clave vieja seguiria dentro."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/cuentas/:id/reiniciar-segundo-factor:
    post:
      summary: "Reiniciar el segundo factor"
      description: "Para quien perdio el telefono. ⛔ NO le quita la exigencia: su rol lo sigue necesitando."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/cuentas:
    get:
      summary: "Las cuentas que uno alcanza"
      description: "Con su estado, su segundo factor, su ultimo ingreso y sus roles. Avisa de las bloqueadas y de las que tienen el segundo factor sin activar."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: "Crear una cuenta"
      description: "Devuelve una contrasena provisional UNA vez y no se vuelve a mostrar: se entrega en persona o por canal seguro, y el sistema obliga a cambiarla al entrar."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/iglesias:
    post:
      summary: "Desplegar una iglesia"
      description: "Crea la sede colgada de la maestra, le aplica la plantilla (que debe ser de su tipo o la MAESTRA), deja apagado lo de compuerta legal y asigna el pastor con `nivelPastor` (N2 a N4, por omision N3, nunca por encima del techo del rol)."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/integraciones:
    get:
      summary: "Estado de las integraciones"
      description: "Por cada tercero (SendGrid, reCAPTCHA, PayU): si esta configurado (solo si o no, nunca la llave), su ultimo intento, su cortacircuitos y su modo degradado."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/lecturas:
    get:
      summary: "Quien miro que"
      description: "La bitacora de lectura de datos N3 y N4: busca por texto, filtra por `nivel` y pagina. Devuelve el total."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/matriz:
    get:
      summary: "Que puede hacer un rol, casilla por casilla"
      description: "Devuelve TODAS las combinaciones posibles de modulo x accion para ese rol, marcadas o no. La columna `por_encima` avisa de un permiso que engana: existe en la tabla y no sirve, porque el modulo guarda datos mas sensibles que el techo del rol."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: "Marcar o desmarcar una casilla"
      description: "Otorga o quita UNA accion a un rol. Exige `acta` (acta o motivo): el cambio queda en la auditoria con quien, cuando y por que. Un rol descontinuado no recibe permisos nuevos. Responde si hubo cambio o si la casilla ya estaba asi."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/organigrama:
    get:
      summary: "El organigrama"
      description: "La central, sus regiones, sus direcciones y sus equipos, con cuantas sedes alcanza cada uno."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/personas/:id:
    get:
      summary: "Ficha completa de una persona"
      description: "Su cuenta, sus roles vigentes con el acta que los autoriza y los equipos a los que pertenece. Es lo que se abre al pulsar a alguien en la consola."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/personas:
    post:
      summary: "Registrar a una persona"
      description: "Exige N4. Si la fecha de nacimiento es de un menor, exige `acudienteId` (un adulto ya registrado) y `parentesco` (un vinculo que confiere custodia): se registran juntos. El correo, si viene, debe tener forma de correo."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/plantillas/:codigo/borrar:
    post:
      summary: "Borrar una plantilla"
      description: "Se niega si ya se desplego alguna iglesia con ella: borrarla dejaria sin explicacion por que esa iglesia nacio como nacio."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/plantillas/:codigo/modulos:
    post:
      summary: "Marcar un modulo en la plantilla"
      description: "Se niega a quitar un modulo de nucleo: sin el, una iglesia nueva no podria ni registrar personas."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/plantillas:
    get:
      summary: "Las plantillas de iglesia"
      description: "Que modulos trae una iglesia nueva segun su tipo. Los de compuerta legal nacen apagados."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: "Crear o renombrar una plantilla"
      description: "Con `nueva: true` crea la plantilla con sus modulos de nucleo ya puestos y se niega si el codigo existe. Sin `nueva`, edita. La descripcion vacia conserva la anterior."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/recertificar/:asignacionId:
    post:
      summary: "Recertificar un acceso"
      description: "La puerta que NO existia: `identidad.recertificaciones` llevaba desde la migracion 0045 sin que nadie escribiera en ella, asi que la pantalla del comite trimestral era una lista que no se podia tachar y los dias sin revisar solo podian crecer. Exige veredicto (se_mantiene, se_reduce, se_revoca) y una nota firmada. Un veredicto de «se_revoca» NO se queda en una nota: revoca de verdad."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/recertificar:
    get:
      summary: "Accesos por recertificar"
      description: "Un permiso que nadie revisa es un permiso que nadie quito."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/roles:
    post:
      summary: "Crear o cambiar un rol"
      description: "Con `nuevo: true` CREA y se niega si el codigo ya existe (antes reescribia el rol de toda la red). Sin `nuevo`, EDITA y se niega si no existe. Lo que no se manda no se toca. Bajar el techo o descontinuar queda escrito en la bitacora."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/sedes/:id/estado:
    post:
      summary: "Desactivar o reactivar una iglesia"
      description: "Una iglesia no se borra: se desactiva con `motivo`, y se reactiva igual. Deja de ofrecerse en los formularios y su historia se conserva. La sede maestra no se desactiva. Queda en la auditoria y en la bitacora de aprovisionamiento."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/sedes/:id/modulos:
    get:
      summary: "Los modulos de una sede"
      description: "Cuales estan encendidos y cual es su evidencia legal. Avisa de los encendidos con compuerta legal y sin referencia juridica."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: "Encender o apagar un modulo"
      description: "La base impone las reglas: un modulo de nucleo no se apaga, uno con compuerta legal no se enciende sin evidencia, y uno no se enciende si su dependencia esta apagada."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/sedes/:id:
    get:
      summary: "Ficha completa de una iglesia"
      description: "Cuanta gente tiene, cuantos grupos, cuantos modulos encendidos, quien la pastorea y que unidades la alcanzan. Avisa en rojo si no tiene pastor: una sede sin pastor no se opera sola."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/sesiones/:id/cerrar:
    post:
      summary: "Cerrarle la sesion a alguien"
      description: "«Sesiones y alertas» era de SOLO LECTURA: se veia quien estaba dentro y no habia forma de echarlo. Exige motivo escrito y surte efecto en el instante, no cuando expire el token. Va por una funcion aparte con guardia, porque la que usa `/auth/salir` no comprueba quien llama (existe para cerrar la propia)."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/sesiones:
    get:
      summary: "Quien esta dentro ahora"
      description: "Sesiones abiertas, desde cuando, desde que direccion y cuanto les queda."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/unidades/:id/miembros/:personaId/salir:
    post:
      summary: "Sacar a alguien de un equipo"
      description: "Surte efecto ya, sin esperar a manana, y exige motivo."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/unidades/:id/miembros:
    post:
      summary: "Meter a alguien en un equipo"
      description: "Hereda los roles del equipo desde ese instante."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/unidades/:id/roles:
    post:
      summary: "Otorgar un rol AL EQUIPO"
      description: "Es la pieza que convierte «un grupo de personas» en «Tesoreria»: lo heredan sus integrantes mientras esten dentro y se les cae al salir. Exige el acta que lo autoriza."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/unidades/:id:
    get:
      summary: "La ficha de un equipo"
      description: "Sus integrantes, sus roles y las sedes que alcanza por esa via."
      responses:
        "200": { description: correcto }
        "401": { description: "sin sesion valida", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "demasiadas peticiones" }
        "500": { description: "error inesperado", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/administracion/unidades/roles/:asignacionId/revocar:
    post:
