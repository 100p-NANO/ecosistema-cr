<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>auth.css · Login</title>
<link rel="stylesheet" href="src/styles/variables.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/modules/ui-components.css">
<link rel="stylesheet" href="src/styles/modules/auth.css">
</head><body>
<div class="auth"><div class="auth__caja">
  <div class="auth__marca">
    <div style="font-size:var(--texto-xl);font-weight:600;color:var(--azul-700)">Casa Roca</div>
    <div style="color:var(--texto-tenue);font-size:var(--texto-sm)">Sistema 100p</div>
  </div>
  <div class="auth__campo"><label class="etiqueta" for="u">Correo</label>
    <input class="campo" id="u" type="email" placeholder="nombre@casaroca.org"></div>
  <div class="auth__campo"><label class="etiqueta" for="p">Contraseña</label>
    <input class="campo" id="p" type="password"></div>
  <div class="auth__acciones">
    <button class="btn btn--primario" style="justify-content:center">Entrar</button>
    <div class="auth__olvide"><a href="#">Olvidé mi contraseña</a></div>
  </div>
</div></div></body></html>
