# Cabeceras de seguridad del sitio. Se INCLUYEN en cada `location` que
# declare su propio `add_header`.
# ⛔ 21 sep 2026 · nginx solo hereda los `add_header` del nivel de arriba
#    cuando el bloque NO declara ninguno propio. `location /` declaraba su
#    Cache-Control y con eso perdía TODAS estas: el HTML de la aplicación
#    salía sin política de contenido y sin protección contra que otro sitio
#    lo metiera en un marco.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Sin scripts en línea: la configuración de ejecución va en /config.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
