# Casa Roca AI System — Prototipo Fase 0 (borrador / demo)
# Sitio estático: no requiere build. Netlify sirve la carpeta tal cual.
[build]
  publish = "."
  command = ""

# Página de entrada: el Hub (mapa con todas las páginas).
# El index del prototipo sigue accesible en /index.html
[[redirects]]
  from = "/"
  to = "/hub.html"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Borrador: pedir a buscadores que NO lo indexen
    X-Robots-Tag = "noindex, nofollow"

# ------------------------------------------------------------
# CACHÉ · por qué está esto aquí, con fecha
# El 11 de septiembre de 2026 un panel siguió enseñando todas sus
# pestañas después de que el centro de mando le quitara los módulos.
# No fallaba el permiso: el navegador tenía guardado el HTML viejo,
# el de antes de que existiera el puente de permisos, y no volvió a
# pedirlo nunca. Un permiso que no llega por caché se ve igual que un
# permiso roto, y cuesta lo mismo diagnosticarlo.
#
# El HTML es la pieza que DECIDE qué scripts se cargan, así que se
# revalida siempre. Los assets sí se cachean fuerte, porque van
# sellados con ?v= y ese sello cambia cuando cambian (ver sellar.sh).
# ------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ------------------------------------------------------------
# EL SISTEMA CONSTRUIDO, EN DEMOSTRACIÓN (/sistema/) · 21 sep 2026
# Es la aplicación de `frontend/` servida con `config.js` en modo
# demostración: los datos salen de `src/demo.js` y no hay servidor
# detrás. Lleva la MISMA política de contenido que el contenedor de
# producción (`frontend/cabeceras-seguridad.conf`): sin scripts en
# línea, sin fuentes ni imágenes de terceros. `connect-src` queda en
# 'self' porque en demostración no se llama a ninguna API.
# ⛔ X-Frame-Options no se repite aquí: Netlify junta con una coma los
#    valores de dos reglas que coinciden, y «SAMEORIGIN, DENY» no es un
#    valor válido. El marco lo decide frame-ancestors.
# ------------------------------------------------------------
[[headers]]
  for = "/sistema/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
